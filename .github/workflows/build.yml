
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "Checking Android SDK..."
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SelectCopyAndroid_FreeWebNovel_v1_4.zip

      
      - name: Align Java target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("SelectCopyAndroid/app/build.gradle")
          s = p.read_text()

          pos = s.rfind("}")
          if pos < 0:
              raise SystemExit("Android block not found")

          settings = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          s = s[:pos] + settings + s[pos:]
          p.write_text(s)
          PY

          
      - name: Build APK
        working-directory: SelectCopyAndroid
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SelectCopy-APK
          path: SelectCopyAndroid/app/build/outputs/apk/debug/app-debug.apk
